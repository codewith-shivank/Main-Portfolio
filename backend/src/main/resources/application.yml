server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: portfolio-rag-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

# Security & CORS
app:
  security:
    jwt-secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1kZXYtand0LXNlY3JldC1zaGl2YW5rLTIwMjY=}
    jwt-expiration-ms: 86400000
    admin-password: ${ADMIN_PASSWORD:shivank2026}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    model: gemini-3.8-flash
    embedding-model: gemini-embedding-2-preview
    max-retrieved-chunks: 5
    temperature: 0.1
  rate-limit:
    chat-per-minute: 35
    ingest-per-minute: 10

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
