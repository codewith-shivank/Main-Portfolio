<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle dark radial glow -->
  <rect width="1200" height="630" fill="#09090b"/>
  <circle cx="950" cy="180" r="380" fill="#06b6d4" fill-opacity="0.08" filter="blur(80px)"/>
  <circle cx="200" cy="480" r="280" fill="#3b82f6" fill-opacity="0.06" filter="blur(80px)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="20" stroke="#27272a" stroke-width="2"/>

  <!-- Brand Monogram -->
  <rect x="90" y="90" width="72" height="72" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <text x="126" y="136" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#22d3ee">SM</text>

  <!-- Status / Availability Badge -->
  <rect x="180" y="104" width="370" height="44" rx="10" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-opacity="0.4"/>
  <circle cx="204" cy="126" r="5" fill="#10b981"/>
  <text x="222" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#34d399">Available for Full Stack Opportunities</text>

  <!-- Name and Title -->
  <text x="90" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Shivank Maurya</text>
  <text x="90" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#38bdf8">Full Stack Developer | Technical Support</text>

  <!-- Description -->
  <text x="90" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa">
    Building modern, scalable web applications with React, TypeScript, Next.js, and Node.js.
  </text>
  <text x="90" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#71717a">
    Bridging high-volume Swiggy platform customer support operations with clean full-stack code.
  </text>

  <!-- Keyword Pills Bar -->
  <g transform="translate(90, 460)">
    <rect x="0" y="0" width="130" height="40" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="65" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#e4e4e7">React.js</text>

    <rect x="145" y="0" width="145" height="40" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="217" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#e4e4e7">TypeScript</text>

    <rect x="305" y="0" width="130" height="40" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="370" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#e4e4e7">Node.js</text>

    <rect x="450" y="0" width="130" height="40" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="515" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#e4e4e7">Next.js</text>

    <rect x="595" y="0" width="140" height="40" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="665" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#e4e4e7">MongoDB</text>

    <rect x="750" y="0" width="155" height="40" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="827" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#e4e4e7">PostgreSQL</text>
  </g>

  <!-- Location and Verified Tag -->
  <text x="90" y="550" font-family="'JetBrains Mono', monospace" font-size="16" fill="#71717a">Lucknow, India · Babu Banarasi Das University · Niftel Communications</text>
  <text x="1110" y="550" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#22d3ee">ATS-Optimized Portfolio</text>
</svg>
